[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revefi-llm-sdk"
version = "0.1.3"
description = "LLM observability SDK for Revefi - Traceloop-based monitoring with custom ingestor service"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Revefi", email = "support@revefi.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring"
]
requires-python = ">=3.8"
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "traceloop-sdk>=0.18.0",
    "opentelemetry-instrumentation>=0.41b0",
    "opentelemetry-instrumentation-openai>=0.18.0",
    "opentelemetry-instrumentation-anthropic>=0.18.0"
]

[project.urls]
Homepage = "https://github.com/revefi/revefi-llm-sdk"
Repository = "https://github.com/revefi/revefi-llm-sdk"
Issues = "https://github.com/revefi/revefi-llm-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["revefi_llm_sdk*"]